<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoS | Bengkel Kramat Motor</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/Login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <section class="hero-section">
      <div class="container">
        <div class="row align-items-center min-vh-100 py-5 g-4">
          <div class="col-12 col-lg-7 text-white text-center text-lg-start">
            <p class="login-eyebrow">
              <span class="login-eyebrow-dot" aria-hidden="true"></span>
              Bengkel Kramat Motor
            </p>
            <h1 class="display-5 fw-bold">Kramat Motor</h1>
            <p class="lead login-lead">
              Sistem kasir dan stok opname sparepart yang rapi, cepat, dan mudah
              dipantau.
            </p>
            <ul class="login-fitur">
              <li>
                <i class="bi bi-check2-circle" aria-hidden="true"></i>
                Kelola stok sparepart
              </li>
              <li>
                <i class="bi bi-check2-circle" aria-hidden="true"></i>
                Catat transaksi dan pembayaran
              </li>
              <li>
                <i class="bi bi-check2-circle" aria-hidden="true"></i>
                Pantau laporan penjualan
              </li>
            </ul>
          </div>

          <div class="col-12 col-lg-5">
            <div class="card login-card p-4">
              <h2 class="h4 mb-3">Masuk</h2>
              <p class="login-sub">Masukkan akun untuk melanjutkan.</p>
              <form id="loginForm">
                <div
                  id="pesanError"
                  class="alert alert-danger py-2 d-none"
                  role="alert"
                >
                  Username atau password salah.
                </div>

                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    required
                    placeholder="Masukan Username"
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      required
                      placeholder="Masukan Password"
                    />
                    <button
                      type="button"
                      class="btn btn-toggle-pw"
                      id="togglePassword"
                      aria-label="Tampilkan password"
                    >
                      <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Masuk
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="JS/data.js"></script>
    <script src="JS/Login.js"></script>
  </body>
</html>
